services:

    _defaults:
        autoconfigure: true
        autowire:      true

    Jmf\RenderingPreset\:
        resource: '../src/'

    Jmf\RenderingPreset\Preset\PresetRepository:
        arguments:
            $presetsConfig: '%jmf_rendering_preset.preset_configurations%'

    Jmf\RenderingPreset\Preset\PresetRepositoryInterface:
        alias: Jmf\RenderingPreset\Preset\PresetRepository

    Jmf\RenderingPreset\Property\PropertyRepository:
        arguments:
            $propertiesConfig: '%jmf_rendering_preset.property_configurations%'

    Jmf\RenderingPreset\Property\PropertyRepositoryInterface:
        alias: Jmf\RenderingPreset\Property\PropertyRepository

    Jmf\RenderingPreset\Twig\RenderingPresetExtension:
        arguments:
            $prefix: '%jmf_rendering_preset.twig_functions_prefix%'
